<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta  name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
</head>
<body style="margin:0;padding:0;background:transparent">
    <div style="margin:0;padding:0;">
        <div id="mv-preview-root" style="
    background:#ffffff;
    border:1px solid #e7ebf3;
    border-radius:12px;
    overflow:hidden;
    width:100%;
    box-sizing:border-box;
    ">
            <div id="mv-title-slot" style="font-family:Calibri,Arial,sans-serif;font-size:16px;font-weight:600;line-height:1.3;margin:0 0 12px 0; color:#111;">
                {{TITLE}}
            </div>
            <div id="mv-content-slot" style="padding:18px 20px; font-family:Calibri,Arial,sans-serif;font-size:15px;line-height:1.45;color:#111827;">
                {{CONTENT}}
            </div>
            {{IMAGE_SECTION}}
            <div style="padding:14px 20px;border-top:1px solid #eef2f8;font-family:Calibri,Arial,sans-serif;font-size:12px;color:#6b7280;">
                Este es un mensaje automático. Favor de no responder.
            </div>
        </div>
    </div>
</body>
</html>
